<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Typing Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #222;
      font-family: sans-serif;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #loading-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
    }

    #logo {
      max-width: 200px;
    }

    #project-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    #progress-bar {
      width: 300px;
      height: 20px;
      background: #444;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: #4CAF50;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="loading-box">
      <img id="logo" src="logo.png" alt="Logo" />
      <div id="project-title">3D Typing Test</div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
  </div>

  <!-- Unity loader script: MUST be included to define createUnityInstance -->
  <script src="Build/68f4db3824cf87a9966f0e5a341742d9.loader.js"></script>

  <script>
    const buildUrl = "Build";
    const config = {
      dataUrl: buildUrl + "/e99dca91df89642bb8c1cd2852750520.data",
      frameworkUrl: buildUrl + "/ee044c09ec5ba0c99884c502d98b3495.framework.js",
      codeUrl: buildUrl + "/7cf9e129f42d1192f91eec7e28f63306.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ABHISHEK",
      productName: "3D Typing Test",
      productVersion: "0.1",
    };

    const canvas = document.getElementById("unity-canvas");
    const loadingBox = document.getElementById("loading-box");
    const progressFill = document.getElementById("progress-fill");

    createUnityInstance(canvas, config, (progress) => {
      progressFill.style.width = (progress * 100) + "%";
    }).then((unityInstance) => {
      loadingBox.style.display = "none";
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>
</html>
